<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Film Studio</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles -->
    <style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-bounce-short { animation: bounceShort 1s ease-in-out infinite; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes bounceShort { 
            0%, 100% { transform: translateY(0); } 
            50% { transform: translateY(-5px); } 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans selection:bg-teal-200">
    <!-- Root element for React App -->
    <div id="root"></div>

    <!-- Application Logic -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- DATA ---
        const VOCABULARY = [
            // Types of films
            { eng: 'film', ipa: '/fɪlm/', vie: 'bộ phim', ex: 'I want to watch a film.', type: 'Types of films' },
            { eng: 'cinema', ipa: '/ˈsɪnəmə/', vie: 'rạp chiếu phim', ex: 'Let\'s go to the cinema.', type: 'Types of films' },
            { eng: 'comedy', ipa: '/ˈkɒmədi/', vie: 'phim hài', ex: 'This is a funny comedy.', type: 'Types of films' },
            { eng: 'documentary', ipa: '/ˌdɒkjəˈmentəri/', vie: 'phim tài liệu', ex: 'I enjoy watching documentaries.', type: 'Types of films' },
            { eng: 'fantasy', ipa: '/ˈfæntəsi/', vie: 'phim giả tưởng', ex: 'The film is a fantasy.', type: 'Types of films' },
            { eng: 'horror film', ipa: '/ˈhɒrə fɪlm/', vie: 'phim kinh dị', ex: 'Horror films are frightening.', type: 'Types of films' },
            { eng: 'science fiction film', ipa: '/ˌsaɪəns ˈfɪkʃən fɪlm/', vie: 'phim khoa học viễn tưởng', ex: 'This science fiction film is about the future.', type: 'Types of films' },
            { eng: 'cartoon', ipa: '/kɑːˈtuːn/', vie: 'phim hoạt hình', ex: 'My sister likes cartoons.', type: 'Types of films' },
            // Adjectives
            { eng: 'dull', ipa: '/dʌl/', vie: 'tẻ nhạt', ex: 'The film was dull.', type: 'Adjectives' },
            { eng: 'violent', ipa: '/ˈvaɪələnt/', vie: 'bạo lực', ex: 'The film was too violent.', type: 'Adjectives' },
            { eng: 'confusing', ipa: '/kənˈfjuːzɪŋ/', vie: 'khó hiểu', ex: 'The story was confusing.', type: 'Adjectives' },
            { eng: 'shocking', ipa: '/ˈʃɒkɪŋ/', vie: 'gây sốc', ex: 'The story was shocking.', type: 'Adjectives' },
            { eng: 'enjoyable', ipa: '/ɪnˈdʒɔɪəbl/', vie: 'thú vị', ex: 'I think the film is enjoyable.', type: 'Adjectives' },
            { eng: 'boring', ipa: '/ˈbɔːrɪŋ/', vie: 'nhàm chán', ex: 'The film was boring.', type: 'Adjectives' },
            { eng: 'funny', ipa: '/ˈfʌni/', vie: 'hài hước', ex: 'This comedy is funny and interesting.', type: 'Adjectives' },
            { eng: 'frightening', ipa: '/ˈfraɪtənɪŋ/', vie: 'đáng sợ', ex: 'The horror film was frightening.', type: 'Adjectives' },
            { eng: 'interesting', ipa: '/ˈɪntrəstɪŋ/', vie: 'thú vị', ex: 'The film is very interesting.', type: 'Adjectives' },
            { eng: 'moving', ipa: '/ˈmuːvɪŋ/', vie: 'cảm động', ex: 'The ending was moving.', type: 'Adjectives' },
            { eng: 'silly', ipa: '/ˈsɪli/', vie: 'ngớ ngẩn', ex: 'Some parts are silly.', type: 'Adjectives' },
            { eng: 'scary', ipa: '/ˈskeəri/', vie: 'đáng sợ', ex: 'The film was scary.', type: 'Adjectives' },
            { eng: 'exciting', ipa: '/ɪkˈsaɪtɪŋ/', vie: 'hấp dẫn, hào hứng', ex: 'The story was exciting.', type: 'Adjectives' },
            // Talking about films
            { eng: 'actor', ipa: '/ˈæktə/', vie: 'nam diễn viên', ex: 'He is a great actor.', type: 'Talking about films' },
            { eng: 'actress', ipa: '/ˈæktrəs/', vie: 'nữ diễn viên', ex: 'She is a famous actress.', type: 'Talking about films' },
            { eng: 'star', ipa: '/stɑː/', vie: 'đóng vai chính', ex: 'Who stars in it?', type: 'Talking about films' },
            { eng: 'audience', ipa: '/ˈɔːdiəns/', vie: 'khán giả', ex: 'The audience loved the film.', type: 'Talking about films' },
            { eng: 'review', ipa: '/rɪˈvjuː/', vie: 'bài đánh giá', ex: 'What are the reviews like?', type: 'Talking about films' },
            { eng: 'scene', ipa: '/siːn/', vie: 'cảnh phim', ex: 'The scenes were amazing.', type: 'Talking about films' },
            // Pronunciation
            { eng: 'idea', ipa: '/aɪˈdɪə/', vie: 'ý tưởng', ex: 'That\'s a great idea!', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'pier', ipa: '/pɪə/', vie: 'cầu tàu', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'really', ipa: '/ˈrɪəli/', vie: 'thực sự', ex: 'I really enjoyed it.', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'fear', ipa: '/fɪə/', vie: 'nỗi sợ', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'ear', ipa: '/ɪə/', vie: 'tai', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'nightmare', ipa: '/ˈnaɪtmeə/', vie: 'cơn ác mộng', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'their', ipa: '/ðeə/', vie: 'của họ', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'share', ipa: '/ʃeə/', vie: 'chia sẻ', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'hair', ipa: '/heə/', vie: 'tóc', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            { eng: 'chair', ipa: '/tʃeə/', vie: 'ghế', ex: '', type: 'Pronunciation /ɪə/ & /eə/' },
            // Patterns
            { eng: 'What kind of film is it?', ipa: '/wɒt kaɪnd əv fɪlm ɪz ɪt/', vie: 'Đó là thể loại phim gì?', ex: '', type: 'Sentence patterns' },
            { eng: 'It\'s a comedy.', ipa: '/ɪts ə ˈkɒmədi/', vie: 'Đó là một bộ phim hài.', ex: '', type: 'Sentence patterns' },
            { eng: 'What\'s it about?', ipa: '/wɒts ɪt əˈbaʊt/', vie: 'Bộ phim nói về điều gì?', ex: '', type: 'Sentence patterns' },
            { eng: 'Who stars in it?', ipa: '/huː stɑːz ɪn ɪt/', vie: 'Ai đóng vai chính trong phim?', ex: '', type: 'Sentence patterns' },
            { eng: 'Do you like documentaries?', ipa: '/duː juː laɪk ˌdɒkjəˈmentəriz/', vie: 'Bạn có thích phim tài liệu không?', ex: '', type: 'Sentence patterns' },
            { eng: 'Although it was scary, I enjoyed it.', ipa: '/ɔːlˈðəʊ ɪt wəz ˈskeəri aɪ ɪnˈdʒɔɪd ɪt/', vie: 'Mặc dù phim đáng sợ, tôi vẫn thích nó.', ex: '', type: 'Sentence patterns' },
            { eng: 'Let\'s go to the cinema tonight!', ipa: '/lets ɡəʊ tə ðə ˈsɪnəmə təˈnaɪt/', vie: 'Tối nay chúng ta hãy đi xem phim nhé!', ex: '', type: 'Sentence patterns' }
        ];

        // --- UTILS ---
        const speak = (text, rate = 1) => {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = rate;
            window.speechSynthesis.speak(utterance);
        };

        const normalizeStr = (str) => {
            if(!str) return '';
            return str.toLowerCase().replace(/[.,!?]/g, '').trim();
        };

        // --- COMPONENTS ---
        const VoiceRecorder = ({ targetText, onResult }) => {
            const [isRecording, setIsRecording] = useState(false);
            const [audioUrl, setAudioUrl] = useState(null);
            const [transcript, setTranscript] = useState('');
            const mediaRecorderRef = useRef(null);
            const recognitionRef = useRef(null);
            const audioChunksRef = useRef([]);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.lang = 'en-GB';
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.interimResults = false;

                    recognitionRef.current.onresult = (event) => {
                        const text = event.results[0][0].transcript;
                        setTranscript(text);
                        if (onResult) onResult(text);
                    };
                }
            }, [onResult]);

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (event) => {
                        audioChunksRef.current.push(event.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                        setAudioUrl(URL.createObjectURL(audioBlob));
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    if (recognitionRef.current) recognitionRef.current.start();
                    setIsRecording(true);
                    setTranscript('');
                } catch (err) {
                    // Fallback to text indicating no microphone
                    alert('Microphone access denied or not supported.');
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                }
                if (recognitionRef.current && isRecording) {
                    try { recognitionRef.current.stop(); } catch(e){}
                }
                setIsRecording(false);
            };

            const playAudio = () => {
                if (audioUrl) {
                    const audio = new Audio(audioUrl);
                    audio.play();
                }
            };

            const checkMatch = () => {
                if (!targetText || !transcript) return null;
                const target = normalizeStr(targetText);
                const spoken = normalizeStr(transcript);
                if (target === spoken) return { ok: true, msg: "Excellent! Your words match perfectly. 🎉" };
                return { ok: false, msg: `You said: "${transcript}". Keep practicing! Try to match: "${targetText}"` };
            };

            const matchRes = checkMatch();

            return (
                <div className="flex flex-col items-center gap-2 mt-4 p-4 bg-gray-50 rounded-xl border border-gray-200 w-full">
                    <div className="flex gap-2 justify-center">
                        {!isRecording ? (
                            <button onClick={startRecording} className="flex items-center gap-1 px-3 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors shadow-sm">
                                🎤 {audioUrl ? 'Record Again' : 'Record'}
                            </button>
                        ) : (
                            <button onClick={stopRecording} className="flex items-center gap-1 px-3 py-2 bg-gray-800 text-white rounded-lg animate-pulse shadow-sm">
                                ⏹ Stop
                            </button>
                        )}
                        
                        {audioUrl && (
                            <button onClick={playAudio} className="flex items-center gap-1 px-3 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600 transition-colors shadow-sm">
                                ▶ Play My Voice
                            </button>
                        )}
                    </div>

                    {transcript && targetText && (
                        <div className={`mt-2 p-3 rounded-lg text-sm text-center w-full ${matchRes.ok ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800'}`}>
                            {matchRes.msg}
                        </div>
                    )}
                    {!transcript && audioUrl && (
                        <div className="mt-2 text-xs text-gray-500 text-center">
                            (Speech recognition might not be supported in this browser, but you can still play back your voice to compare!)
                        </div>
                    )}
                </div>
            );
        };

        const Flashcards = ({ onBack }) => {
            const categories = ['All', ...new Set(VOCABULARY.map(v => v.type))];
            const [filter, setFilter] = useState('All');
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);

            const filteredWords = filter === 'All' ? VOCABULARY : VOCABULARY.filter(v => v.type === filter);
            const currentCard = filteredWords[currentIndex];

            useEffect(() => {
                setCurrentIndex(0);
                setIsFlipped(false);
            }, [filter]);

            const handleNext = () => {
                setIsFlipped(false);
                setCurrentIndex((prev) => (prev + 1) % filteredWords.length);
            };

            const handlePrev = () => {
                setIsFlipped(false);
                setCurrentIndex((prev) => (prev - 1 + filteredWords.length) % filteredWords.length);
            };

            if (!currentCard) return null;

            return (
                <div className="flex flex-col items-center max-w-2xl mx-auto w-full animate-fade-in">
                    <div className="flex justify-between w-full mb-4 items-center">
                        <button onClick={onBack} className="text-teal-600 font-bold hover:underline">← Back to Home</button>
                        <select 
                            className="border-2 border-teal-200 rounded-lg p-2 text-teal-800 outline-none"
                            value={filter} 
                            onChange={e => setFilter(e.target.value)}
                        >
                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                    </div>

                    <div className="text-gray-500 font-medium mb-4">Card {currentIndex + 1} of {filteredWords.length}</div>

                    {/* Card */}
                    <div className="w-full relative h-[420px] perspective-1000">
                        <div className={`w-full h-full transition-transform duration-500 preserve-3d cursor-pointer ${isFlipped ? 'rotate-y-180' : ''}`}>
                            
                            {/* Front */}
                            <div className="absolute w-full h-full backface-hidden bg-white border-2 border-teal-100 rounded-2xl shadow-lg p-8 flex flex-col items-center justify-center text-center" onClick={() => setIsFlipped(true)}>
                                <div className="text-5xl mb-4">🎬</div>
                                <h2 className="text-4xl font-bold text-gray-800 mb-2">{currentCard.eng}</h2>
                                <p className="text-xl text-teal-600 font-mono mb-6">{currentCard.ipa}</p>
                                <div className="flex gap-4 mt-auto">
                                    <button onClick={(e) => { e.stopPropagation(); speak(currentCard.eng); }} className="bg-orange-100 hover:bg-orange-200 text-orange-700 p-3 rounded-full text-2xl transition-transform hover:scale-110">🔊</button>
                                    <button onClick={(e) => { e.stopPropagation(); speak(currentCard.eng, 0.75); }} className="bg-orange-100 hover:bg-orange-200 text-orange-700 p-3 rounded-full text-sm font-bold flex items-center justify-center transition-transform hover:scale-110">0.75x</button>
                                </div>
                                <p className="text-gray-400 mt-6 text-sm">Tap card to flip</p>
                            </div>

                            {/* Back */}
                            <div className="absolute w-full h-full backface-hidden bg-teal-50 border-2 border-teal-200 rounded-2xl shadow-lg p-8 flex flex-col items-center justify-start text-center rotate-y-180 overflow-y-auto" onClick={(e) => { if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) setIsFlipped(false) }}>
                                <h3 className="text-2xl font-bold text-teal-800 mb-2">{currentCard.vie}</h3>
                                
                                {currentCard.ex && (
                                <div className="mt-4 p-4 bg-white rounded-xl shadow-sm w-full">
                                    <p className="text-gray-800 font-medium italic">"{currentCard.ex}"</p>
                                    <button onClick={(e) => { e.stopPropagation(); speak(currentCard.ex); }} className="mt-2 text-teal-600 hover:text-teal-800 font-bold text-sm">🔊 Listen to example</button>
                                </div>
                                )}

                                <div className="mt-auto w-full" onClick={e => e.stopPropagation()}>
                                    <VoiceRecorder targetText={currentCard.eng} />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between w-full mt-6">
                        <button onClick={handlePrev} className="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl font-bold hover:bg-gray-300">Previous</button>
                        <button onClick={handleNext} className="px-6 py-3 bg-teal-500 text-white rounded-xl font-bold hover:bg-teal-600 shadow-md">Next Card</button>
                    </div>
                </div>
            );
        };

        const PracticeMenu = ({ onSelectLevel, onBack }) => (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto animate-fade-in">
                <div className="w-full mb-6">
                    <button onClick={onBack} className="text-teal-600 font-bold hover:underline">← Back to Home</button>
                </div>
                <h2 className="text-3xl font-extrabold text-gray-800 mb-8 text-center">🎯 Choose Your Level</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                    <div onClick={() => onSelectLevel('level1')} className="bg-gradient-to-br from-green-400 to-green-600 p-6 rounded-3xl shadow-xl cursor-pointer hover:-translate-y-2 transition-transform text-white text-center">
                        <div className="text-5xl mb-4">🌱</div>
                        <h3 className="text-2xl font-bold mb-2">Level 1: Basic</h3>
                        <p className="text-green-100 text-sm">Listen, choose, and repeat vocabulary.</p>
                    </div>
                    <div onClick={() => onSelectLevel('level2')} className="bg-gradient-to-br from-blue-400 to-blue-600 p-6 rounded-3xl shadow-xl cursor-pointer hover:-translate-y-2 transition-transform text-white text-center">
                        <div className="text-5xl mb-4">🚀</div>
                        <h3 className="text-2xl font-bold mb-2">Level 2: Inter</h3>
                        <p className="text-blue-100 text-sm">Fill blanks, short dialogues & situations.</p>
                    </div>
                    <div onClick={() => onSelectLevel('level3')} className="bg-gradient-to-br from-violet-500 to-purple-700 p-6 rounded-3xl shadow-xl cursor-pointer hover:-translate-y-2 transition-transform text-white text-center">
                        <div className="text-5xl mb-4">🌟</div>
                        <h3 className="text-2xl font-bold mb-2">Level 3: Adv</h3>
                        <p className="text-purple-100 text-sm">Long dialogues, role-play & free speaking.</p>
                    </div>
                </div>
            </div>
        );

        // --- LEVEL 1 ---
        const L1_QUESTIONS = [
            { type: 'choose', audio: 'comedy', options: ['comedy', 'documentary', 'fantasy'], answer: 0 },
            { type: 'choose', audio: 'frightening', options: ['funny', 'frightening', 'interesting'], answer: 1 },
            { type: 'choose', audio: 'science fiction film', options: ['horror film', 'cartoon', 'science fiction film'], answer: 2 },
            { type: 'choose', audio: 'enjoyable', options: ['enjoyable', 'shocking', 'violent'], answer: 0 },
            { type: 'choose', audio: 'documentary', options: ['comedy', 'documentary', 'cartoon'], answer: 1 },
            { type: 'sound_detective', audio: 'idea', options: ['/ɪə/', '/eə/'], answer: 0 },
            { type: 'sound_detective', audio: 'nightmare', options: ['/ɪə/', '/eə/'], answer: 1 },
            { type: 'sound_detective', audio: 'fear', options: ['/ɪə/', '/eə/'], answer: 0 },
            { type: 'sound_detective', audio: 'share', options: ['/ɪə/', '/eə/'], answer: 1 },
            { type: 'repeat', target: 'I like comedies.' },
            { type: 'repeat', target: 'What kind of film is it?' }
        ];

        const Level1 = ({ onBack, saveScore }) => {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [status, setStatus] = useState('idle'); // idle, correct, incorrect, done
            const [selected, setSelected] = useState(null);

            const q = L1_QUESTIONS[idx];

            const handleAnswer = (index) => {
                if (status !== 'idle') return;
                setSelected(index);
                if (index === q.answer) {
                    setStatus('correct');
                    setScore(s => s + 10);
                } else {
                    setStatus('incorrect');
                }
            };

            const handleNext = () => {
                if (idx < L1_QUESTIONS.length - 1) {
                    setIdx(idx + 1);
                    setStatus('idle');
                    setSelected(null);
                } else {
                    setStatus('done');
                    saveScore('level1', score);
                }
            };

            if (status === 'done') {
                const percent = Math.round((score / (L1_QUESTIONS.length * 10)) * 100);
                return (
                    <div className="text-center p-8 bg-white rounded-3xl shadow-xl max-w-md mx-auto animate-fade-in border-4 border-green-400">
                        <h2 className="text-3xl font-bold mb-4 text-green-600">Level 1 Complete! 🎉</h2>
                        <p className="text-xl mb-4">Your Score: {score} / {L1_QUESTIONS.length * 10}</p>
                        <p className="text-gray-600 italic mb-6">
                            {percent < 50 ? "Let's practise the basics again!" : percent < 80 ? "Good progress! Keep practising!" : "Excellent! Ready for the next challenge!"}
                        </p>
                        <button onClick={onBack} className="bg-green-500 text-white px-6 py-3 rounded-full font-bold hover:bg-green-600">Return to Menu</button>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto w-full animate-fade-in">
                    <button onClick={onBack} className="text-teal-600 font-bold hover:underline mb-4">← Back</button>
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border-t-8 border-green-500">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-sm font-bold text-gray-400">Task {idx + 1} of {L1_QUESTIONS.length}</span>
                            <span className="text-sm font-bold text-green-500">Score: {score}</span>
                        </div>

                        {q.type === 'choose' || q.type === 'sound_detective' ? (
                            <div className="flex flex-col items-center">
                                <h3 className="text-xl font-bold text-gray-800 mb-4 text-center">
                                    {q.type === 'choose' ? 'Listen and Choose' : 'Sound Detective: /ɪə/ or /eə/?'}
                                </h3>
                                <button onClick={() => speak(q.audio)} className="w-24 h-24 bg-orange-400 hover:bg-orange-500 text-white rounded-full flex items-center justify-center text-5xl mb-8 shadow-lg transition-transform hover:scale-110 animate-bounce-short">
                                    🔊
                                </button>
                                
                                <div className="grid gap-3 w-full max-w-sm">
                                    {q.options.map((opt, i) => {
                                        let btnClass = "bg-gray-100 hover:bg-gray-200 text-gray-800";
                                        if (status !== 'idle') {
                                            if (i === q.answer) btnClass = "bg-green-500 text-white font-bold ring-4 ring-green-200";
                                            else if (i === selected) btnClass = "bg-red-500 text-white";
                                            else btnClass = "bg-gray-100 opacity-50";
                                        }
                                        return (
                                            <button key={i} onClick={() => handleAnswer(i)} disabled={status !== 'idle'} className={`p-4 rounded-xl text-lg transition-all ${btnClass}`}>
                                                {opt}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col items-center">
                                <h3 className="text-xl font-bold text-gray-800 mb-4">Listen and Repeat</h3>
                                <div className="p-4 bg-teal-50 border border-teal-200 rounded-xl mb-6 w-full text-center">
                                    <p className="text-2xl font-bold text-teal-800 mb-2">{q.target}</p>
                                    <button onClick={() => speak(q.target)} className="text-teal-600 font-bold hover:underline">🔊 Listen</button>
                                </div>
                                <VoiceRecorder targetText={q.target} onResult={() => { if(status === 'idle') { setStatus('correct'); setScore(s => s + 10); } }} />
                            </div>
                        )}

                        {status !== 'idle' && (
                            <div className="mt-8 flex flex-col items-center animate-fade-in">
                                {status === 'correct' ? <p className="text-green-600 font-bold text-lg mb-4">Excellent! 🎉</p> : status === 'incorrect' ? <p className="text-red-500 font-bold text-lg mb-4">Good try! The correct answer was highlighted.</p> : null}
                                <button onClick={handleNext} className="bg-teal-500 text-white px-8 py-3 rounded-full font-bold shadow-md hover:bg-teal-600 w-full max-w-xs">Next →</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- LEVEL 2 ---
        const L2_QUESTIONS = [
            { type: 'fill', audio: 'The film was very boring.', display: 'The film was very ______.', answer: 'boring' },
            { type: 'fill', audio: 'Although the film was long, it was enjoyable.', display: '______ the film was long, it was enjoyable.', answer: 'although' },
            { type: 'fill', audio: 'Let\'s go to the cinema tonight.', display: 'Let\'s go to the ______ tonight.', answer: 'cinema' },
            { type: 'dialogue', 
                script: [ {s: 'Anna', t: 'What kind of film do you want to see?'}, {s: 'Tom', t: 'I want to see a comedy.'}, {s: 'Anna', t: 'Why?'}, {s: 'Tom', t: 'Because comedies are funny and enjoyable.'} ],
                q: 'What kind of film does Tom want to see?', options: ['A horror film', 'A comedy', 'A documentary'], answer: 1 
            },
            { type: 'respond', prompt: 'What kind of films do you like?', hint: 'E.g., I like comedies.' },
        ];

        const Level2 = ({ onBack, saveScore }) => {
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [status, setStatus] = useState('idle'); 
            const [inputValue, setInputValue] = useState('');
            
            const q = L2_QUESTIONS[idx];

            const checkFill = () => {
                if (normalizeStr(inputValue) === normalizeStr(q.answer)) {
                    setStatus('correct');
                    setScore(s => s + 10);
                } else {
                    setStatus('incorrect');
                }
            };

            const handleNext = () => {
                if (idx < L2_QUESTIONS.length - 1) {
                    setIdx(idx + 1);
                    setStatus('idle');
                    setInputValue('');
                } else {
                    setStatus('done');
                    saveScore('level2', score);
                }
            };

            const playDialogue = async () => {
                for (let line of q.script) {
                    speak(line.t);
                    await new Promise(r => setTimeout(r, 2000));
                }
            };

            if (status === 'done') {
                return (
                    <div className="text-center p-8 bg-white rounded-3xl shadow-xl max-w-md mx-auto border-4 border-blue-400">
                        <h2 className="text-3xl font-bold mb-4 text-blue-600">Level 2 Complete! 🚀</h2>
                        <p className="text-xl mb-6">Your Score: {score}</p>
                        <button onClick={onBack} className="bg-blue-500 text-white px-6 py-3 rounded-full font-bold hover:bg-blue-600">Return to Menu</button>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto w-full animate-fade-in">
                    <button onClick={onBack} className="text-teal-600 font-bold hover:underline mb-4">← Back</button>
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border-t-8 border-blue-500">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-sm font-bold text-gray-400">Task {idx + 1} of {L2_QUESTIONS.length}</span>
                            <span className="text-sm font-bold text-blue-500">Score: {score}</span>
                        </div>

                        {q.type === 'fill' && (
                            <div className="flex flex-col items-center">
                                <h3 className="text-xl font-bold mb-6">Listen and Fill in the Blank</h3>
                                <button onClick={() => speak(q.audio)} className="mb-6 p-4 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200">🔊 Listen</button>
                                <p className="text-xl mb-6">{q.display}</p>
                                <input type="text" value={inputValue} onChange={e => setInputValue(e.target.value)} disabled={status !== 'idle'} className="border-2 border-gray-300 rounded-xl p-3 text-center text-lg w-full max-w-xs focus:border-blue-500 outline-none" placeholder="Type here..." />
                                {status === 'idle' && <button onClick={checkFill} className="mt-4 bg-blue-500 text-white px-6 py-2 rounded-lg font-bold">Check</button>}
                            </div>
                        )}

                        {q.type === 'dialogue' && (
                            <div className="flex flex-col items-center w-full">
                                <h3 className="text-xl font-bold mb-4">Listen and Answer</h3>
                                <button onClick={playDialogue} className="mb-6 px-6 py-3 bg-blue-100 text-blue-700 font-bold rounded-xl hover:bg-blue-200 flex items-center gap-2">▶ Play Dialogue</button>
                                <div className="bg-gray-50 w-full p-4 rounded-xl mb-6">
                                    <p className="font-bold mb-3">{q.q}</p>
                                    <div className="grid gap-2">
                                        {q.options.map((opt, i) => (
                                        <button key={i} onClick={() => { if(status==='idle') { if(i===q.answer){setStatus('correct'); setScore(s=>s+10)}else{setStatus('incorrect')} } }} disabled={status !== 'idle'} className={`p-3 rounded-lg text-left transition-colors ${status!=='idle' ? (i===q.answer?'bg-green-500 text-white': 'bg-gray-200 text-gray-500') : 'bg-white border hover:bg-blue-50'}`}>
                                            {opt}
                                        </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {q.type === 'respond' && (
                            <div className="flex flex-col items-center w-full">
                                <h3 className="text-xl font-bold mb-4">Listen and Respond</h3>
                                <button onClick={() => speak(q.prompt)} className="mb-6 p-4 bg-orange-100 text-orange-600 rounded-full hover:bg-orange-200">🔊 Listen to Question</button>
                                <VoiceRecorder targetText={null} onResult={() => { if(status==='idle') {setStatus('correct'); setScore(s=>s+10)} }}/>
                                <p className="text-gray-400 mt-4 text-sm italic">Hint: {q.hint}</p>
                            </div>
                        )}

                        {status !== 'idle' && (
                            <div className="mt-6 flex flex-col items-center border-t pt-4 border-gray-100">
                                {status === 'correct' ? <p className="text-green-600 font-bold mb-3">Great job! ⭐</p> : <p className="text-red-500 font-bold mb-3">Keep trying! {q.answer ? `Answer: ${q.answer}` : ''}</p>}
                                <button onClick={handleNext} className="bg-blue-500 text-white px-8 py-3 rounded-full font-bold shadow-md hover:bg-blue-600 w-full max-w-xs">Next →</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- LEVEL 3 ---
        const L3_QUESTIONS = [
            { type: 'challenge', audio: 'Hi Jack. I watched a science fiction film yesterday. It was about people travelling into space. Although it was a little long, I really enjoyed it.', q: 'What was the film about?', options: ['Space travel', 'A funny cat', 'A scary house'], answer: 0 },
            { type: 'speak_open', title: 'Film Reviewer Challenge', prompt: 'Talk about your favourite film (Type, about, opinion). Use words like "although" or "however".', hint: 'E.g., My favourite film is Doraemon. It is a cartoon...' },
            { type: 'roleplay', botIntro: 'Hi! What shall we do tonight?', userRole: 'Suggest going to the cinema.' }
        ];

        const Level3 = ({ onBack, saveScore }) => {
            const [idx, setIdx] = useState(0);
            const [status, setStatus] = useState('idle');
            const q = L3_QUESTIONS[idx];

            const handleNext = () => {
                if (idx < L3_QUESTIONS.length - 1) {
                    setIdx(idx + 1);
                    setStatus('idle');
                } else {
                    setStatus('done');
                    saveScore('level3', 100);
                }
            };

            if (status === 'done') {
                return (
                    <div className="text-center p-8 bg-white rounded-3xl shadow-xl max-w-md mx-auto border-4 border-purple-500">
                        <h2 className="text-3xl font-bold mb-4 text-purple-600">Level 3 Complete! 🌟</h2>
                        <p className="text-gray-600 mb-6">Amazing! You have completed the advanced challenges!</p>
                        <button onClick={onBack} className="bg-purple-500 text-white px-6 py-3 rounded-full font-bold hover:bg-purple-600">Return to Menu</button>
                    </div>
                );
            }

            return (
                <div className="max-w-2xl mx-auto w-full animate-fade-in">
                    <button onClick={onBack} className="text-teal-600 font-bold hover:underline mb-4">← Back</button>
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl border-t-8 border-purple-500">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-sm font-bold text-gray-400">Task {idx + 1} of {L3_QUESTIONS.length}</span>
                        </div>

                        {q.type === 'challenge' && (
                            <div className="flex flex-col items-center">
                                <h3 className="text-xl font-bold mb-4 text-purple-800">Listening Challenge</h3>
                                <button onClick={() => speak(q.audio)} className="mb-6 px-6 py-3 bg-purple-100 text-purple-700 font-bold rounded-xl hover:bg-purple-200">▶ Play Audio</button>
                                <p className="font-bold mb-4 w-full">{q.q}</p>
                                <div className="grid gap-2 w-full">
                                    {q.options.map((opt, i) => (
                                    <button key={i} onClick={() => { if(status==='idle') setStatus(i===q.answer ? 'correct' : 'incorrect') }} disabled={status !== 'idle'} className={`p-3 rounded-lg text-left transition-colors ${status!=='idle' ? (i===q.answer?'bg-green-500 text-white': 'bg-gray-200 text-gray-500') : 'bg-white border hover:bg-purple-50'}`}>
                                        {opt}
                                    </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {q.type === 'speak_open' && (
                            <div className="flex flex-col items-center text-center">
                                <h3 className="text-2xl font-bold mb-2 text-purple-800">{q.title}</h3>
                                <p className="text-gray-600 mb-6">{q.prompt}</p>
                                <VoiceRecorder targetText={null} onResult={() => setStatus('correct')} />
                                <p className="mt-4 text-sm text-gray-400 italic">Hint: {q.hint}</p>
                                <button onClick={() => setStatus('correct')} className="mt-4 text-purple-500 text-sm underline">Skip / Done speaking</button>
                            </div>
                        )}

                        {q.type === 'roleplay' && (
                            <div className="flex flex-col items-center w-full">
                                <h3 className="text-xl font-bold mb-4 text-purple-800">Role-play: At the Cinema</h3>
                                <div className="bg-purple-50 p-4 rounded-xl w-full mb-4">
                                    <p className="font-bold text-purple-900 mb-2">AI Friend:</p>
                                    <div className="flex items-center gap-3">
                                        <p className="flex-1">"{q.botIntro}"</p>
                                        <button onClick={() => speak(q.botIntro)} className="p-2 bg-white rounded-full shadow text-purple-600">🔊</button>
                                    </div>
                                </div>
                                <div className="border border-purple-200 p-4 rounded-xl w-full text-center mb-4">
                                    <p className="text-gray-500 mb-2">Your turn:</p>
                                    <p className="font-bold text-gray-800 mb-4">{q.userRole}</p>
                                    <VoiceRecorder targetText={null} onResult={() => setStatus('correct')} />
                                    <button onClick={() => setStatus('correct')} className="mt-4 text-purple-500 text-sm underline">Done speaking</button>
                                </div>
                            </div>
                        )}

                        {status !== 'idle' && (
                            <div className="mt-6 flex flex-col items-center border-t pt-4 border-gray-100 animate-fade-in">
                                {status === 'correct' ? <p className="text-green-600 font-bold mb-3">Well done! 🌟</p> : <p className="text-red-500 font-bold mb-3">Good try!</p>}
                                <button onClick={handleNext} className="bg-purple-500 text-white px-8 py-3 rounded-full font-bold shadow-md hover:bg-purple-600 w-full max-w-xs">Next Challenge →</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('home'); // home, flashcards, practice, level1, level2, level3
            const [scores, setScores] = useState({ level1: 0, level2: 0, level3: 0 });

            useEffect(() => {
                const saved = localStorage.getItem('filmStudioScores');
                if (saved) {
                    try { setScores(JSON.parse(saved)); } catch(e){}
                }
            }, []);

            const saveScore = (level, score) => {
                const newScores = { ...scores, [level]: Math.max(scores[level], score) };
                setScores(newScores);
                localStorage.setItem('filmStudioScores', JSON.stringify(newScores));
            };

            const renderView = () => {
                switch (view) {
                    case 'flashcards': return <Flashcards onBack={() => setView('home')} />;
                    case 'practice': return <PracticeMenu onSelectLevel={setView} onBack={() => setView('home')} />;
                    case 'level1': return <Level1 onBack={() => setView('practice')} saveScore={saveScore} />;
                    case 'level2': return <Level2 onBack={() => setView('practice')} saveScore={saveScore} />;
                    case 'level3': return <Level3 onBack={() => setView('practice')} saveScore={saveScore} />;
                    default:
                        return (
                            <div className="flex flex-col items-center justify-center text-center animate-fade-in max-w-4xl mx-auto py-8">
                                <div className="mb-8">
                                    <h1 className="text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-yellow-500 mb-4 drop-shadow-sm">
                                        🎬 ENGLISH FILM STUDIO
                                    </h1>
                                    <h2 className="text-2xl font-bold text-teal-700 mb-2">UNIT 8 – FILMS</h2>
                                    <p className="text-lg text-gray-600 font-medium">Learn Vocabulary – Listen – Speak – Shine!</p>
                                </div>

                                <div className="grid md:grid-cols-2 gap-8 w-full px-4 mb-12">
                                    <div 
                                        onClick={() => setView('flashcards')}
                                        className="bg-white rounded-3xl p-8 shadow-xl cursor-pointer hover:shadow-2xl hover:-translate-y-2 transition-all border-b-8 border-orange-400 group"
                                    >
                                        <div className="text-6xl mb-4 group-hover:scale-110 transition-transform">📚</div>
                                        <h3 className="text-3xl font-bold text-gray-800 mb-2">FLASHCARDS</h3>
                                        <p className="text-gray-500">Learn & Speak Vocabulary</p>
                                        <div className="mt-4 text-sm font-bold text-orange-500 bg-orange-50 inline-block px-3 py-1 rounded-full">All Items</div>
                                    </div>

                                    <div 
                                        onClick={() => setView('practice')}
                                        className="bg-white rounded-3xl p-8 shadow-xl cursor-pointer hover:shadow-2xl hover:-translate-y-2 transition-all border-b-8 border-teal-500 group"
                                    >
                                        <div className="text-6xl mb-4 group-hover:scale-110 transition-transform">🎯</div>
                                        <h3 className="text-3xl font-bold text-gray-800 mb-2">PRACTICE</h3>
                                        <p className="text-gray-500">Listen & Speak Challenges</p>
                                        <div className="mt-4 text-sm font-bold text-teal-600 bg-teal-50 inline-block px-3 py-1 rounded-full">3 Levels</div>
                                    </div>
                                </div>

                                <div className="w-full max-w-xl bg-white p-6 rounded-2xl shadow-md">
                                    <h4 className="text-xl font-bold text-gray-700 mb-4 border-b pb-2">🏆 Your Progress</h4>
                                    <div className="flex justify-around text-center">
                                        <div>
                                            <div className="text-2xl font-bold text-green-500">{scores.level1}</div>
                                            <div className="text-sm text-gray-500">L1 Score</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-blue-500">{scores.level2}</div>
                                            <div className="text-sm text-gray-500">L2 Score</div>
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-purple-500">{scores.level3 > 0 ? 'Done' : '0'}</div>
                                            <div className="text-sm text-gray-500">L3 Status</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                }
            };

            return (
                <div className="container mx-auto px-4 max-w-5xl">
                    {renderView()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
